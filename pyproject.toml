[project]
name = "churn-mlops-forecasting-ops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "dagster>=1.7",
  "dagster-webserver>=1.7",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
