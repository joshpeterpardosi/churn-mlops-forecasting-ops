[project]
name = "churn-mlops-forecasting-ops"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "dagster>=1.7",
  "dagster-webserver>=1.7",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "numpy>=1.26",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "mlflow>=2.14",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "evidently==0.4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "B", "RUF"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.dagster]
module_name = "churn_mlops.definitions"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
